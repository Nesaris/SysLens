<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SysLens — console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Ctitle%3ESysLens%3C/title%3E%3Cstyle%3Epath%7Bfill%3A%231A1A1A%7D%40media%20%28prefers-color-scheme%3A%20dark%29%7Bpath%7Bfill%3A%23F4F4F2%7D%7D%3C/style%3E%3Cpath%20d%3D%27M26%203H11A8%208%200%200%200%2011%2019H22A2%202%200%200%201%2022%2023H11V29H22A8%208%200%200%200%2022%2013H11A2%202%200%200%201%2011%209H26ZM2%2026A3%203%200%201%200%208%2026A3%203%200%201%200%202%2026Z%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: salle de supervision la nuit : sombre, dense, précise, rien de décoratif qui ne porte une donnée.
   IDEA: un pupitre d'instruments : jauges graduées, colonnes de volume, matrice de voyants par client.
   PICTURE: la rangée de jauges + la colonne de volume avec le cadran de risque ; la file d'incidents juste dessous.
   COLOUR and TYPE: noir vert profond, un seul accent vert ; rouge/orange/jaune réservés aux 4 niveaux ; Geist + Geist Mono.
   LAYOUT: rail 228 px, barre haute de recherche, grille de cartes + colonne droite événements, pile sous 980 px. */
:root{color-scheme:light dark;
--bg:light-dark(#edf1ef,#060a09);--side:light-dark(#f7f9f8,#090e0c);--panel:light-dark(#ffffff,#0c1210);--panel2:light-dark(#f2f5f3,#111915);
--line:light-dark(#dce3df,#18221e);--line2:light-dark(#cbd5d0,#1f2b26);--ink:light-dark(#0e1915,#e5ede9);--mute:light-dark(#5a6b64,#7a8a83);
--acc:light-dark(#0c8a55,#3fe08e);--acc-dim:light-dark(#dcf3e7,#0d2619);--on-acc:light-dark(#ffffff,#03170c);
--crit:light-dark(#c8171d,#ff5a5f);--grav:light-dark(#b4500c,#ff9248);--moy:light-dark(#876a00,#f0c94a);--ben:light-dark(#9aa8a2,#34433d);
--fw:light-dark(#0c8a55,#3fe08e);--sw:light-dark(#1d6bd0,#58b9ff);--ap:light-dark(#7449d4,#b89cff);
--mono:'Geist Mono',ui-monospace,Menlo,monospace}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 'Geist',system-ui,sans-serif;overflow-x:clip;font-feature-settings:"tnum"}
button,input,select{font:inherit;color:inherit}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg{display:block}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.app.mini{grid-template-columns:68px minmax(0,1fr)}
.side{background:var(--side);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow-y:auto;overflow-x:hidden}
.brand{display:flex;gap:10px;align-items:center;padding:2px 4px;min-height:40px;flex:none}.brand .logo{flex:none}
.brand>div{min-width:0;overflow:hidden;display:flex;align-items:center}.brand .logo,.brand .word{color:var(--ink);display:block}.brand .word{width:auto}.brand b{font-size:16px;font-weight:600;letter-spacing:-.01em;display:block;white-space:nowrap}.brand span{font-size:12px;color:var(--mute);white-space:nowrap}
.fold{margin-left:auto;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:none;display:grid;place-items:center;cursor:pointer;color:var(--mute);flex:none}
.fold:hover{color:var(--ink);border-color:var(--line2)}
.scope{display:grid;grid-template-columns:1fr auto;gap:0 8px;align-items:center;width:100%;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;min-height:52px}
.scope:hover{border-color:var(--line2)}.scope span{font-size:11.5px;color:var(--mute);grid-column:1}
.scope b{grid-column:1;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scope kbd,.pick kbd{grid-column:2;grid-row:1/3;font:11px var(--mono);color:var(--mute);border:1px solid var(--line2);border-radius:5px;padding:1px 5px}
.pick{position:fixed;left:10px;top:118px;width:min(380px,calc(100vw - 20px));background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 18px 50px #0007;z-index:7;display:flex;flex-direction:column;max-height:min(560px,calc(100vh - 140px))}
.pick[hidden]{display:none}
.pick .ph{padding:10px;border-bottom:1px solid var(--line)}
.pick input{width:100%}
.pl{overflow-y:auto;padding:6px}
.pl h4{margin:8px 8px 4px;font-size:11.5px;font-weight:400;color:var(--mute)}
.pi{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer}
.pi.hl{background:var(--panel2)}.pi[aria-selected=true] b::after{content:" ✓";color:var(--acc)}
.pi .pa{width:30px;height:30px;border-radius:8px;background:var(--panel2);display:grid;place-items:center;font:600 11px var(--mono);color:var(--mute)}
.pi.hl .pa{background:var(--panel)}
.pi b{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pi span span{font-size:12px;color:var(--mute)}
.pi mark{background:var(--acc-dim);color:var(--acc);border-radius:3px}
.pick .pf{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
nav{display:flex;flex-direction:column;gap:14px}
.grp{display:flex;flex-direction:column;gap:1px}
.grp>p{margin:0 0 4px;padding:0 10px;font-size:11.5px;color:var(--mute)}
nav a{position:relative;display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:8px;color:var(--mute);text-decoration:none;min-height:38px}
nav a svg{flex:none;width:16px;height:16px}
nav a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav a:hover{color:var(--ink);background:var(--panel2)}
nav a.on{color:var(--ink);background:var(--panel2)}
nav a.on::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--acc)}
nav a.on svg{color:var(--acc)}
nav a em{margin-left:auto;font:500 11.5px var(--mono);font-style:normal;border-radius:9px;padding:0 7px;min-width:20px;text-align:center}
em.b-crit{background:var(--crit);color:#fff}em.b-warn{background:color-mix(in srgb,var(--grav) 18%,transparent);color:var(--grav)}em.b-n{background:var(--panel);color:var(--mute);border:1px solid var(--line2)}
.health{margin-top:auto;border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:7px;font-size:12.5px}
.health div{display:flex;align-items:center;gap:8px;white-space:nowrap}
.health i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.health b{margin-left:auto;font:400 12px var(--mono);color:var(--mute)}
.me{display:flex;align-items:center;gap:10px;padding:2px 4px}
.me .av{width:30px;height:30px;border-radius:50%;background:var(--acc-dim);color:var(--acc);display:grid;place-items:center;font:600 12px 'Geist',sans-serif;flex:none}
.me b{display:block;font-size:13px;font-weight:500;white-space:nowrap}.me span{font-size:11.5px;color:var(--mute);white-space:nowrap}
.side .demo{font-size:11.5px;color:var(--mute);margin:0;padding:0 6px}
.mini .brand>div,.mini .scope,.mini .grp>p,.mini nav a span,.mini .health,.mini .me>div,.mini .side .demo{display:none}
.mini .brand{flex-direction:column;gap:12px}.mini .fold{margin:0}.mini .fold svg{transform:rotate(180deg)}
.mini nav a{justify-content:center;padding:7px 0}
.mini nav a em{position:absolute;top:5px;right:9px;min-width:0;width:8px;height:8px;padding:0;font-size:0;border:0}
.mini .grp+.grp{border-top:1px solid var(--line);padding-top:12px}.mini .me{justify-content:center}
.ext{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.45fr);gap:14px;align-items:start}
.xl{display:grid;gap:8px}
.xi{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;width:100%}
.xi:hover{border-color:var(--line2)}.xi.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.xi .xg{width:36px;height:36px;border-radius:9px;background:var(--panel2);display:grid;place-items:center;font:600 14px 'Geist',sans-serif;color:var(--ink)}
.xi b{display:block;font-weight:500}.xi span{font-size:12px;color:var(--mute)}
.xi.soon{opacity:.6}
.xdh{display:flex;gap:14px;align-items:center;margin-bottom:18px}.xdh h2{font-size:20px;margin:0}.xdh .sub{margin:2px 0 0}
.xbar{display:flex;gap:4px;margin:4px 0 6px}.xbar i{flex:1;height:4px;border-radius:2px;background:var(--line2)}.xbar i.done{background:var(--acc)}.xbar i.cur{background:color-mix(in srgb,var(--acc) 55%,var(--line2))}
.xstep{font:12px var(--mono);color:var(--mute);margin:0 0 18px}#drawer .xh{font-size:21px;font-weight:600;letter-spacing:-.01em;margin:0 0 4px}
#drawer h2{text-wrap:balance}.xbody{margin-top:14px}.xf1{display:grid;gap:14px}.xf1 label{display:grid;gap:5px;font-size:13px;color:var(--mute)}.xf1 .note{font-size:12.5px}
.xhow{margin:0 0 16px;padding:0 0 0 20px;display:grid;gap:6px;font-size:14px;color:var(--ink)}.xhow li::marker{color:var(--mute);font-family:var(--mono)}
.xrows{margin:16px 0 0;display:grid;gap:0}.xrows>div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line)}.xrows dt{font-size:13px;color:var(--mute)}.xrows dd{margin:0;grid-column:1;font-size:14px;overflow-wrap:anywhere}.xrows .lnk{grid-row:1/3;grid-column:2;align-self:center}
.lnk{background:none;border:0;color:var(--acc);font:inherit;font-size:13.5px;cursor:pointer;padding:6px 4px;min-height:32px}.lnk:hover{text-decoration:underline}
.xtest .prog{margin-bottom:10px}
.xwait{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border:1px dashed var(--line2);border-radius:10px;font-size:14px}.xwait i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--acc);animation:spin .8s linear infinite;flex:none}.xwait .lnk{margin-left:auto}
.xnews{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.updbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--acc);border-radius:12px;padding:10px 14px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.xchoice{display:grid;gap:10px}.xopt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line2);border-radius:12px;padding:14px;cursor:pointer}.xopt:has(input:checked){border-color:var(--acc);background:var(--acc-dim)}.xopt input{margin-top:3px;accent-color:var(--acc);width:18px;height:18px;flex:none}.xopt>span{display:grid;gap:3px}.xopt>span .xg{width:32px;height:32px;border-radius:8px;margin-bottom:4px}.xopt b{font-weight:600}
.xcur{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.xcur h2{margin:0;font-size:18px}.xcur .sub{margin:2px 0 0}
.xsum{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.xsec{margin-top:22px}.xsec>h2{display:flex;align-items:baseline;gap:8px;margin:0 0 10px;font-size:15px;font-weight:600}.xsec>h2 small{font:12px var(--mono);color:var(--mute);font-weight:400}
.xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.xc{display:flex;flex-direction:column;gap:12px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;min-height:210px;color:inherit;font:inherit;transition:border-color .15s,background .15s}
.xc:hover{border-color:var(--line2);background:color-mix(in srgb,var(--panel) 92%,var(--ink))}.xc:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.xc .xtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.xg{width:48px;height:48px;flex:none;border-radius:12px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;color:var(--ink)}
.xg b{font:600 19px 'Geist',sans-serif}.xg img{width:100%;height:100%;object-fit:contain}.xg.has{background:none;border-color:transparent}.xg.has b{display:none}.xg.has.small{background:var(--panel2);border-color:var(--line)}.xg.small img{width:28px;height:28px}.xg svg{width:24px;height:24px}.xg.mono{position:relative}.xg.mono img{visibility:hidden}.xg.mono::after{content:'';position:absolute;inset:0;margin:auto;width:100%;height:100%;background:var(--ink);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}.xg.small.mono::after{width:28px;height:28px}
.xc h3{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}.xc .ty{display:block;font-size:12.5px;color:var(--mute);margin-top:1px}
.xc p{margin:0;font-size:13.5px;line-height:1.45;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.xc .caps{display:flex;flex-wrap:wrap;gap:4px}.xc .caps span{font:11.5px var(--mono);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--mute)}
.xc .xft{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--mute);border-top:1px solid var(--line);padding-top:10px}
.xc .xft em{font-style:normal;font-weight:500;color:var(--ink)}
.xc.soon{background:transparent}.xc.soon .xg,.xc.soon h3{opacity:.6}
.xc.new{border-style:dashed;background:transparent}.xc.new .xg{margin-bottom:0}.xc.new .xg{background:var(--acc-dim);border-color:transparent;color:var(--acc)}
.xtree{font:12.5px/1.7 var(--mono);color:var(--mute);margin:8px 0 0}.xtree b{color:var(--ink);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:20px;padding:5px 11px;font-size:13px;cursor:pointer;min-height:34px}
.chip input{width:16px;height:16px;margin:0;accent-color:var(--acc)}
.chip:has(input:checked){border-color:var(--acc);background:var(--acc-dim);color:var(--ink)}
.sw{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink);cursor:pointer}.sw input{width:20px;height:20px;accent-color:var(--acc);margin:0}
.fs{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.fs h3{font-size:14px;font-weight:600;margin:0 0 10px}
.prev{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px}
.prev b.n{font:500 22px var(--mono)}
.mono-l{font:12.5px/1.6 var(--mono);color:var(--mute)}
.top{display:flex;gap:10px;align-items:center;padding:14px clamp(14px,2.4vw,32px);border-bottom:1px solid var(--line);position:sticky;top:0;background:color-mix(in srgb,var(--bg) 92%,transparent);z-index:3}
.search{flex:1 1 320px;max-width:520px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 12px;min-height:40px;color:var(--mute)}
.search input[type=search]{border:0;background:none;outline:none;padding:0;flex:1;min-height:38px;font-size:15px;color:var(--ink)}
.search:focus-within{border-color:var(--acc)}
.top select{width:auto;min-width:200px}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--acc);border:1px solid var(--line2);border-radius:20px;padding:4px 11px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 22%,transparent)}
.pill.off{color:var(--mute)}
.bell{position:relative;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;margin-left:auto}
.bell i{position:absolute;top:-5px;right:-5px;font:500 11px var(--mono);font-style:normal;background:var(--crit);color:#fff;border-radius:9px;padding:0 6px}
select,input[type=text],input[type=url],input[type=number],input[type=search],input[type=password]{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:40px;font-size:15px;width:100%}
main{padding:22px clamp(14px,2.4vw,32px) 48px;max-width:1500px;width:100%}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:28px;font-weight:600;line-height:1.1;margin:0 0 4px;letter-spacing:-.02em;text-wrap:balance}
.sub{color:var(--mute);margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--panel)}
.seg button{border:0;background:none;border-radius:7px;padding:6px 12px;min-height:34px;cursor:pointer;color:var(--mute);font:500 13px var(--mono)}
.seg button.on{background:var(--acc-dim);color:var(--acc)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;position:relative}
.card h3{font-size:13.5px;font-weight:500;margin:0 0 12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.card h3 .ico,.card h3 .tag{flex:none}
.card h3 a,.card h3 .tag{font-weight:400}
.ico{width:28px;height:28px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;color:var(--mute)}
.big{font:500 38px/1 'Geist',system-ui,sans-serif;letter-spacing:-.03em}.dec{color:var(--mute)}.big small{font-size:.5em;color:var(--mute);margin-left:2px}
.note{font-size:12.5px;color:var(--mute);margin:6px 0 0}
.ov{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}
.ovmain{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;grid-template-areas:"logs g g" "logs line dots" "tbl tbl tbl"}
.c-logs{grid-area:logs;display:flex;flex-direction:column}.gauges{grid-area:g;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.c-line{grid-area:line}.c-dots{grid-area:dots}.c-tbl{grid-area:tbl}
.ovside{display:grid;gap:14px;align-content:start}
.gw{position:relative;max-width:240px;margin:0 auto}.gw .gv{position:absolute;left:0;right:0;bottom:0;text-align:center}
.gw .gv .big{font-size:25px}
.c-logs .gw{width:100%;max-width:300px;margin-top:auto;padding-top:12px}.c-logs .gw .gv .big{font-size:44px}
.cols{display:flex;align-items:flex-end;gap:2px;height:170px;margin-top:14px}
.cols div{flex:1;background:var(--line2);border-radius:2px 2px 0 0;min-height:2px}
.cols div.l-moyen{background:var(--moy)}.cols div.l-grave{background:var(--grav)}.cols div.l-critique{background:var(--crit)}
.axis{display:flex;justify-content:space-between;font:11.5px var(--mono);color:var(--mute);margin-top:6px}
.ln{position:relative;height:178px;margin-top:8px}.ln svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ln .th{position:absolute;left:0;transform:translateY(-110%);font:11px var(--mono);color:var(--mute)}
.ln path.l{filter:drop-shadow(0 0 5px color-mix(in srgb,var(--acc) 55%,transparent))}
.dots{display:grid;grid-template-columns:72px repeat(24,minmax(0,1fr));gap:5px 3px;align-items:center;margin-top:8px}
.dots span{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots i{display:block;width:100%;max-width:9px;aspect-ratio:1;border-radius:50%;background:var(--line);margin:auto}

V.clients = () => wiz ? wizView() : cliView ? cliDetail(cliView) : cliList();
function wizStart(cli, isNew, name = '') { wiz = {step: isNew ? 1 : 2, cli, isNew, name, odoo: true, brand: 'zyxel', mode: 'nebula', org: '', col: 'new', site: 'Site principal', ip: '', ssh: false, sshUser: '', token: 'SLK-' + Math.random().toString(36).slice(2, 8).toUpperCase(), prog: [], done: false, err: ''};
  if (!isNew) { const cols = COLLECTORS.filter(x => x.cli === cli); if (cols.length) wiz.col = cols[0].id; } cliView = null; if (route() !== 'clients') location.hash = 'clients'; else render(); }
document.addEventListener('click', e => {
  const t = e.target, g = s => t.closest(s);

  if (g('[data-cback]')) { cliView = null; render(); return; }

  if (g('[data-pok]') || g('[data-pno]')) { const b = g('[data-pok]') || g('[data-pno]'), i = +(b.dataset.pok ?? b.dataset.pno), own = PENDING.filter(p => p.cli === cliView), p = own[i];
    if (b.dataset.pok !== undefined) { devices.push({id: 'sw-' + p.cli.slice(4) + '-' + String(devices.filter(d => d.cli === p.cli).length + 1).padStart(2, '0'), cli: p.cli, fam: p.fam, model: p.model, fw: '4.80', src: 'Syslog', crit: '', last: 0, site: p.site, fresh: true}); }
    PENDING.splice(PENDING.indexOf(p), 1); render(); return; }
  if (!wiz) return;
  if (g('[data-wcancel]')) { wiz = null; render(); return; }
  if (g('[data-wback]')) { wiz.step = Math.max(wiz.isNew ? 1 : 2, wiz.step - 1); wiz.err = ''; render(); return; }
  if (g('[data-wmore]')) { const cli = wiz.cli; wizStart(cli, false); return; }
  if (g('[data-brand]')) { wiz.brand = g('[data-brand]').dataset.brand; render(); return; }
  if (g('[data-mode]')) { wiz.mode = g('[data-mode]').dataset.mode; wiz.err = ''; render(); return; }
  if (g('[data-wnext]')) { const w = wiz; w.err = '';
    if (w.step === 1) { if (w.name.trim().length < 2) { w.err = 'Indiquez le nom de la société.'; return render(); }
      const id = 'cli-' + (clients.length + 1); clients.push({id, name: w.name.trim(), hours: [8, 18], ref: 'C-' + String(clients.length + 1).padStart(4, '0'), tags: w.odoo ? ['Supervision réseau'] : []}); w.cli = id; }
    if (w.step === 3) { if (w.mode === 'nebula' && !w.org) { w.err = 'Choisissez l’organisation Nebula du client.'; return render(); }
      if (w.mode === 'local' && !IPRE.test(w.ip.trim())) { w.err = 'Adresse IP invalide (ex. 192.168.1.1).'; return render(); }
      w.step = 4; render(); wizRun(); return; }
    w.step++; render(); }
});
document.addEventListener('input', e => { const t = e.target;
  if (t.id === 'cq') { cliQ = t.value; cliPage = 0; const pos = t.selectionStart; render(); const n = $('#cq'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
  if (wiz && t.dataset.w && t.type !== 'checkbox') wiz[t.dataset.w] = t.value; });
document.addEventListener('change', e => { const t = e.target; if (!wiz || !t.dataset.w) return;
  if (t.type === 'checkbox') { wiz[t.dataset.w] = t.checked; if (t.dataset.w === 'ssh') render(); } else { wiz[t.dataset.w] = t.value; if (t.dataset.w === 'col') render(); } });
const LIVE = [['ap-a-01','assoc',6],['fw-b-01','traffic',6],['fw-c-01','dhcp',6],['ap-c-01','assoc',6],['sw-d-01','stp',5],['fw-a-01','admin-ko',4],['fw-d-01','traffic',6]];
let tick = 0;
setInterval(() => { if (paused || LIVEMODE) return; tick++; const [d,k,v] = pick(LIVE); mk(d, k, Date.now(), {vsev: v, src: k === 'admin-ko' ? '203.0.113.47' : undefined, user: k === 'admin-ko' ? 'admin' : ''});
  const r = route(), busy = $('#drawer').classList.contains('open') || $('#modal').classList.contains('on') || document.activeElement.matches('input,select');
  if (r === 'logs' && !openRow) $('#logbox').innerHTML = logTable();
  else if ((r === 'overview' || r === 'incidents') && tick % 10 === 0 && !busy) render(); else nav(); }, 1500);

// --- mises à jour (servies par le récepteur : releases GitHub)
let UPD = null, updMsg = '';
const fdt = t => t ? new Date(t).toLocaleString('fr-FR', {dateStyle: 'short', timeStyle: 'short'}) : '—';
function updPanel() {
  if (!LIVEMODE) return `<h2>Mises à jour</h2><p class="sub" style="margin:0">Le serveur SysLens vérifie les releases GitHub toutes les heures et s'installe tout seul. Disponible quand la console est servie par SysLens.</p>`;
  if (!UPD) return `<h2>Mises à jour</h2><p class="sub" style="margin:0">Chargement…</p>`;
  const st = {idle: ['À jour', 'ok'], available: ['Nouvelle version', 'warn'], checking: ['Vérification…', ''], installing: ['Installation…', 'warn'], error: ['Erreur', 'warn']}[UPD.state] || ['—', ''];
  return `<h2 style="display:flex;justify-content:space-between;align-items:center;gap:8px">Mises à jour <span class="tag ${st[1]}">${st[0]}</span></h2>
  <dl class="kv"><dt>Version installée</dt><dd class="mono">${esc(UPD.version)}</dd><dt>Dernière release</dt><dd class="mono">${esc(UPD.latest || '—')}</dd><dt>Dépôt</dt><dd class="mono">github.com/${esc(UPD.repo)}</dd><dt>Mise à jour auto</dt><dd>${UPD.auto ? 'Activée · vérification toutes les heures' : 'Désactivée (SYSLENS_AUTOUPDATE=0)'}</dd><dt>Dernière vérification</dt><dd>${fdt(UPD.checkedAt)}</dd></dl>
  ${UPD.state === 'error' ? `<p class="note" style="color:var(--crit)">${esc(UPD.msg)}</p>` : ''}${updMsg ? `<p class="note">${esc(updMsg)}</p>` : ''}
  ${(UPD.news || []).length ? `<details style="margin-top:12px"${UPD.news[0].version === UPD.version.replace(/^v/, '') ? ' open' : ''}><summary class="note" style="cursor:pointer">Nouveautés</summary>${UPD.news.map(n => `<p style="margin:10px 0 4px"><b class="mono">v${esc(n.version)}</b> <span class="note">${esc(n.date)}</span></p><ul class="xnews">${n.points.map(t => `<li>${esc(t)}</li>`).join('')}</ul>`).join('')}</details>` : ''}
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn" data-upd="check">Vérifier maintenant</button>${UPD.state === 'available' ? `<button class="btn p" data-upd="install">Installer ${esc(UPD.latest)}</button>` : ''}</div>`; }
async function updLoad() { try { UPD = await (await fetch('/api/version', {cache: 'no-store'})).json(); } catch (e) {} if ($('#updPanel')) $('#updPanel').innerHTML = updPanel(); }
document.addEventListener('click', async e => { const b = e.target.closest('[data-upd]'); if (!b) return; b.disabled = true; updMsg = b.dataset.upd === 'install' ? 'Installation en cours, la console se rechargera toute seule.' : '';
  try { const r = await fetch('/api/update', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({install: b.dataset.upd === 'install'})}); UPD = await r.json(); } catch (err) { updMsg = 'Récepteur injoignable.'; }
  if ($('#updPanel')) $('#updPanel').innerHTML = updPanel(); });
let srvVersion = null;
function versionSeen(v) { if (!v) return; if (!srvVersion) { srvVersion = v; return; } if (v === srvVersion) return;
  srvVersion = v; const busy = $('#drawer').classList.contains('open') || $('#modal').classList.contains('on') || document.activeElement.matches('input,select,textarea');
  if (!busy) location.reload(); else { const n = document.createElement('div'); n.className = 'updbar'; n.innerHTML = `SysLens a été mis à jour en <b>${esc(v)}</b>. <button class="btn" onclick="location.reload()">Recharger</button>`; document.body.append(n); } }
// --- mode réel : branché sur le récepteur (servi par lui sur /console)
let liveSince = 0, liveOk = null, liveN = 0;
const MODELS = {'USG20W-VPN':'USG FLEX 50W (USG20W-VPN)','USG20-VPN':'USG FLEX 50 (USG20-VPN)'};
const famOf = p => /^(GS|XGS|XMG|XS|MS|MG)/i.test(p) ? 'Switch' : /^(NWA|WAX|WAC|WBE|NAP)/i.test(p) ? 'Borne' : 'Pare-feu';
function liveK(x) { const f = x.f || {}, txt = (x.msg || '') + ' ' + (x.name || '');
  if (/interface statistics/i.test(x.cat || '')) return 'if-stats';
  if (/system monitoring/i.test(x.cat || '')) return /cpu:(9\d|100)\b|memory:(9\d|100)\b/i.test(txt) ? 'cpu' : 'sysmon';
  if (/default rule/i.test(txt) && /drop|deny|block/i.test(txt + ' ' + (f.act || ''))) return 'deny-default';
  if (x.k && CAT[x.k]) return x.k;
  const k = 'nr:' + (x.cat || x.name || 'Autre');
  if (!CAT[k]) CAT[k] = {k, fam:'Toutes', cat:x.cat || '—', sig:(x.name && x.name !== x.cat ? x.name + ' · ' : '') + (x.cat || 'Log'), base:0, floor:0, st:'nonref', mean:"Type de log pas encore dans le référentiel : noté avec la gravité annoncée par Zyxel.", act:'À qualifier, puis ajouter au référentiel.', src:'Gravité constructeur (CEF)'};
  return k; }
function liveDev(x) { const id = x.host || x.from; let d = devices.find(v => v.id === id);
  if (!d) { const fam = famOf(x.product || ''); d = {id, cli:'cli-test', fam, model:MODELS[x.product] || x.product || '?', fw:x.ver ? 'ZLD ' + x.ver : '—', src:x.fmt === 'CEF' ? 'Syslog CEF' : 'Syslog', crit:fam === 'Pare-feu' ? 'tete' : '', last:0, ip:x.from, lastT:x.t}; devices.push(d); }
  d.lastT = Math.max(d.lastT || 0, x.t); return d; }
function liveEv(x) { const d = liveDev(x), k = liveK(x), c = CAT[k], f = x.f || {};
  events.push({id: ++evId, t: x.t, dev: d.id, cli: d.cli, fam: d.fam, model: d.model, k, cat: x.cat || c.cat, msg: x.msg || '', vsev: x.sev ?? 6, src: f.src || '', dst: f.dst || '', user: f.user || '', admin: !!c.admin, maint: false, raw: x.raw || ''}); }
async function livePoll() { if (paused) return;
  try { const j = await (await fetch('/api/events?since=' + liveSince, {cache:'no-store'})).json();
    versionSeen(j.version);
    for (const x of j.events) { liveEv(x); liveSince = Math.max(liveSince, x.id); }
    if (j.events.length) { events.sort((a,b) => a.t - b.t); if (events.length > 20000) events.splice(0, events.length - 20000); srcCache.clear(); }
    const now = Date.now(); devices.forEach(d => d.last = Math.max(0, Math.round((now - d.lastT) / 60e3)));
    const first = liveOk !== true; liveOk = true; liveN++;
    const r = route(), busy = $('#drawer').classList.contains('open') || $('#modal').classList.contains('on') || document.activeElement.matches('input,select');
    if (r === 'logs' && !openRow) { if (j.events.length) $('#logbox').innerHTML = logTable(); nav(); }
    else if (first || ((r === 'overview' || r === 'incidents' || r === 'devices') && j.events.length && liveN % 3 === 0 && !busy)) render(); else nav();
  } catch (err) { liveOk = false; nav(); } }
if (LIVEMODE) { updLoad(); setInterval(updLoad, 60e3); document.title = 'SysLens — Parc test (réel)'; $('#meSub').textContent = 'Banc de test'; $('#demoNote').textContent = 'Parc test : vrais logs du récepteur · autres clients fictifs'; livePoll(); setInterval(livePoll, 3000); }
render();
}
